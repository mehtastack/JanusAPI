# A hand-written Swagger 2.0 petstore, covering what the Swagger import maps.
swagger: "2.0"
info:
  title: Swagger Petstore
  version: 1.0.0
host: petstore.test
basePath: /v2
schemes: [http, https]
consumes: [application/json]
produces: [application/json]
x-vendor-thing: { ignored: true }
securityDefinitions:
  api_key: { type: apiKey, name: api_key, in: header }
  basicAuth: { type: basic }
  petstore_auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://petstore.test/oauth/authorize
    scopes: { "write:pets": modify pets }
  pw: { type: oauth2, flow: password, tokenUrl: https://petstore.test/oauth/token, scopes: {} }
  app: { type: oauth2, flow: application, tokenUrl: https://petstore.test/oauth/token, scopes: {} }
  code:
    type: oauth2
    flow: accessCode
    authorizationUrl: https://petstore.test/oauth/authorize
    tokenUrl: https://petstore.test/oauth/token
    scopes: {}
security:
  - api_key: []
parameters:
  limitParam: { name: limit, in: query, type: integer, default: 20 }
  traceHeader: { name: X-Trace, in: header, type: string, required: true, default: abc }
  petBody:
    name: body
    in: body
    required: true
    schema: { $ref: "#/definitions/Pet" }
definitions:
  Category:
    type: object
    properties:
      id: { type: integer }
      name: { type: string }
  Pet:
    type: object
    required: [name]
    properties:
      id: { type: integer, format: int64 }
      name: { type: string, example: doggie }
      category: { $ref: "#/definitions/Category" }
      status: { type: string, enum: [available, pending, sold] }
      photoUrls: { type: array, items: { type: string } }
paths:
  /pets:
    get:
      tags: [pets]
      summary: List pets
      operationId: listPets
      parameters:
        - $ref: "#/parameters/limitParam"
        - { name: status, in: query, required: true, type: string, enum: [available, pending] }
        - { name: cursor, in: query, type: string }
        - $ref: "#/parameters/traceHeader"
      responses: { "200": { description: ok, schema: { type: array, items: { $ref: "#/definitions/Pet" } } } }
    post:
      tags: [pets]
      operationId: addPet
      parameters:
        - $ref: "#/parameters/petBody"
      responses: { "200": { description: ok } }
  /pets/{petId}:
    parameters:
      - { name: petId, in: path, required: true, type: integer, default: 42 }
    get:
      tags: [pets]
      operationId: getPet
      security: [ { basicAuth: [] } ]
      responses: { "200": { description: ok } }
    post:
      tags: [pets]
      operationId: updatePetWithForm
      consumes: [application/x-www-form-urlencoded]
      parameters:
        - { name: name, in: formData, type: string }
        - { name: status, in: formData, type: string }
      security: [ { petstore_auth: [ "write:pets" ] } ]
      responses: { "200": { description: ok } }
    delete:
      tags: [pets]
      operationId: deletePet
      security: []
      responses: { "200": { description: ok } }
  /pets/{petId}/uploadImage:
    post:
      tags: [pets]
      operationId: uploadFile
      consumes: [multipart/form-data]
      parameters:
        - { name: petId, in: path, required: true, type: integer }
        - { name: additionalMetadata, in: formData, type: string }
        - { name: file, in: formData, type: file }
      security: [ { app: [] } ]
      responses: { "200": { description: ok } }
  /store/login:
    post:
      tags: [store]
      operationId: login
      parameters:
        - { name: username, in: formData, type: string, required: true }
        - { name: avatar, in: formData, type: file }
      security: [ { pw: [] } ]
      responses: { "200": { description: ok } }
  /store/code:
    get:
      tags: [store]
      operationId: codeFlow
      security: [ { code: [] } ]
      x-internal: true
      responses: { "200": { description: ok } }
