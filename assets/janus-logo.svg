<svg xmlns="http://www.w3.org/2000/svg" width="360" height="72" viewBox="0 0 360 72" role="img" aria-labelledby="t">
  <title id="t">JanusAPI</title>
  <style>
    /* The mark from mehtastack.com/janusapi: the braces draw themselves, then the bar drops in. Plays once; the resting state is the full mark. */
    .brace { fill: none; stroke: #3df5b0; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 0; animation: draw 1.1s cubic-bezier(.45,0,.55,1) .2s both; }
    .bar { stroke: #e8e5df; stroke-width: 6; stroke-linecap: round; transform-box: fill-box; transform-origin: center; animation: drop .6s cubic-bezier(.34,1.8,.64,1) 1s both; }
    .word { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: #3df5b0; animation: rise .8s cubic-bezier(.22,1,.36,1) .5s both; }
    @keyframes draw { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
    @keyframes drop { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g transform="translate(4 4)">
    <path class="brace" pathLength="60" d="M22 10 C14 10 16 22 16 26 C16 30 9 32 9 32 C9 32 16 34 16 38 C16 42 14 54 22 54"/>
    <path class="brace" pathLength="60" d="M42 10 C50 10 48 22 48 26 C48 30 55 32 55 32 C55 32 48 34 48 38 C48 42 50 54 42 54"/>
    <line class="bar" x1="32" y1="12" x2="32" y2="52"/>
  </g>
  <text class="word" x="78" y="52">JanusAPI</text>
</svg>
